name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.7.5

      - name: Install dependencies
        run: nub ci

      - name: Run lint
        run: nub run lint

      - name: Run tests
        run: nub run test:run

      - name: Run typecheck
        run: nub run typecheck

      - name: Build
        run: nub run build

      - name: Create tarball
        run: nub pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
