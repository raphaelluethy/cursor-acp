name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.7.5

      - name: Install dependencies
        run: nub ci

      - name: Run Oxlint
        run: nub run lint

      - name: Check formatting
        run: nub run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.7.5

      - name: Install dependencies
        run: nub ci

      - name: Run tests
        run: nub run test:run

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.7.5

      - name: Install dependencies
        run: nub ci

      - name: Run typecheck
        run: nub run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.7.5

      - name: Install dependencies
        run: nub ci

      - name: Build
        run: nub run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
